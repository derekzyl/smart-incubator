name: incubator_app
description: "Smart Incubator mobile app for monitoring and controlling egg incubators"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # HTTP and WebSocket
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  
  # Charts and visualization
  fl_chart: ^0.65.0
  syncfusion_flutter_gauges: ^24.1.0
  
  # State management
  provider: ^6.1.0
  
  # Local storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  
  # Notifications
  flutter_local_notifications: ^18.0.0
  
  # Utilities
  intl: ^0.18.0
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
